name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Get the server project (a few tests cross-check against it)
        run: |
          git clone --depth 1 https://github.com/NovaGlory901/TOTRsrv.git ../TOTRsrv
          pip install cryptography zeroconf
      - run: npm ci
      - name: Tests (every workspace; the desktop shell runs against a stand-in for Electron)
        run: npm test
      - name: Build the web app
        run: npm run build
